<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentModel Skill — Agent 推荐工作流</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #8b5cf6;
      --amber: #f59e0b;
      --rose: #ec4899;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 36px;
    }
    .hero {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(59,130,246,.14);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 8px 24px rgba(15,23,42,.06);
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .hero-icon { font-size: 36px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .hero-text h1 { font-size: 20px; margin: 0 0 4px; line-height: 1.3; }
    .hero-text p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.65; }
    .chart-card {
      background: var(--card);
      border: 1px solid rgba(59,130,246,.14);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(15,23,42,.06);
      overflow: hidden;
    }
    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(59,130,246,.10);
      background: rgba(59,130,246,.04);
    }
    .chart-head h2 { font-size: 15px; margin: 0; }
    .chart-head span { color: var(--muted); font-size: 12px; }
    .export-btns {
      display: flex;
      gap: 6px;
    }
    .export-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border: 1px solid rgba(59,130,246,.22);
      background: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--blue);
      cursor: pointer;
      transition: all 150ms ease;
      text-decoration: none;
      font-family: inherit;
    }
    .export-btn:hover {
      background: rgba(59,130,246,.08);
      border-color: var(--blue);
    }
    .export-btn svg { width: 13px; height: 13px; }
    #chart { width: 100%; height: 480px; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 18px 16px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(59,130,246,.12);
      background: #fff;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    @media (max-width: 900px) {
      #chart { height: 800px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-icon">🤖</div>
      <div class="hero-text">
        <h1>TalentModel Skill — Agent 推荐工作流</h1>
        <p>Agent 实际执行 Skill 时的推荐工作路径：理解配置 → 企业采样 → 信号归纳 → 提炼维度 → 构建 B/E 层 → MECE 校验 → 生成 HTML 报告 → 自检迭代 → 视觉统一 → 最终交付。</p>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <div style="display:flex;align-items:center;gap:8px">
          <h2>Agent 推荐工作流</h2>
          <span style="color:var(--muted);font-size:12px">理解 → 采样 → 归纳 → 建模 → 输出 → 迭代</span>
        </div>
        <div class="export-btns">
          <button class="export-btn" id="btn-svg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            导出 SVG
          </button>
          <button class="export-btn" id="btn-png">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            导出 PNG
          </button>
        </div>
      </div>
      <div id="chart"></div>
      <div class="legend">
        <span class="tag"><i class="dot" style="background:#3b82f6"></i>理解与配置</span>
        <span class="tag"><i class="dot" style="background:#10b981"></i>采样与信号</span>
        <span class="tag"><i class="dot" style="background:#8b5cf6"></i>建模与映射</span>
        <span class="tag"><i class="dot" style="background:#f59e0b"></i>输出与图表</span>
        <span class="tag"><i class="dot" style="background:#ec4899"></i>用户反馈迭代</span>
      </div>
    </div>
  </div>

  <script>
    const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'svg' });

    /* ─────────────────────────────────────────────────────────────
       Agent 工作流节点（S形曲折布局）
       第1行：y=80，从左到右（6个节点）
       第2行：y=185，从右到左（6个节点）
       最终节点：y=295，居中
    ───────────────────────────────────────────────────────────── */

    const nodes = [
      /* ── 第1行（从左到右）─────────────────────────────── */
      {
        name: '读\nSKILL.md',
        x: 60, y: 80, c: '#3b82f6', s: 64,
        d: '读取 SKILL.md，锁定硬约束：先企业分布探索、先信号归纳表、只输出 HTML、只用 4 类图表。'
      },
      {
        name: '企业分布\n探索',
        x: 200, y: 80, c: '#3b82f6', s: 64,
        d: '先确认目标岗位工程师分布在互联网 / 云平台 / 智能制造等不同企业类型中，避免样本单一。'
      },
      {
        name: 'Q1-Q10\n配置向导',
        x: 340, y: 80, c: '#3b82f6', s: 66,
        d: '完成岗位、级别、场景、边界、行业、地区、验证公司、语言与特殊要求配置。'
      },
      {
        name: '扩展验证\n公司池',
        x: 480, y: 80, c: '#10b981', s: 66,
        d: '补充公开存在目标岗位表述的公司，优先校招 / 实习 / early talent 官方页面。'
      },
      {
        name: '官方入口\n采样',
        x: 620, y: 80, c: '#10b981', s: 66,
        d: '优先使用校招/实习/official careers 页面，WebFetch 验证 URL 有效性，禁止猜测链接。'
      },
      {
        name: '原始信号\n归纳表',
        x: 760, y: 80, c: '#10b981', s: 70,
        d: '整理招聘信号，逐条判断哪些能上升为稳定特质，哪些应降级为行为或证据。≥15行表格输出。'
      },

      /* ── 第2行（从右到左）─────────────────────────────── */
      {
        name: '提炼\n6个维度',
        x: 890, y: 185, c: '#8b5cf6', s: 66,
        d: '从跨企业共性中提炼 D1-D6 一级维度，禁止把技术词(K8s/CUDA)放在顶层；参考历史高频维度仅作校验。'
      },
      {
        name: '构建\nB层+E层',
        x: 760, y: 185, c: '#8b5cf6', s: 66,
        d: '保留三层结构：核心维度(D) → 可观察行为(B) → 角色证据(E)。行为层需可观察，证据层需具体。'
      },
      {
        name: 'MECE\n校验',
        x: 620, y: 185, c: '#8b5cf6', s: 58,
        d: '删除重叠项，保留跨类型共性，降级大厂专属特征和短周期技术热词。'
      },
      {
        name: '生成\nHTML报告',
        x: 480, y: 185, c: '#f59e0b', s: 66,
        d: '输出 8 部分 HTML 报告，并生成 sunburst / treemap / scatter / tree 四类图表；配色遵循 D1-D6 标准色。'
      },
      {
        name: '图表修正\n& 自检',
        x: 340, y: 185, c: '#f59e0b', s: 68,
        d: '旭日图：D1名≤8字符，三级折叠；能力树：D1-D2-D3 完整展开；配色自检：全局一致性。'
      },
      {
        name: '视觉统一\n配色收敛',
        x: 200, y: 185, c: '#ec4899', s: 68,
        d: '统一配色、卡片层级与图表主题；配色：D1=#7b8b78 D2=#a88244 D3=#89a89b D4=#8d6b61 D5=#64748b D6=#31526b'
      },

      /* ── 最终节点 ──────────────────────────────────── */
      {
        name: '✓ 交付\nHTML报告',
        x: 475, y: 300, c: '#10b981', s: 80,
        d: '最终可交付版本。包含：①人才画像全景(旭日图) ②能力对比(矩形树图) ③人才分型(散点图) ④完整结构(能力树)。'
      },
    ];

    const links = [
      /* 第1行（从左到右） */
      { source: '读\nSKILL.md',       target: '企业分布\n探索' },
      { source: '企业分布\n探索',     target: 'Q1-Q10\n配置向导' },
      { source: 'Q1-Q10\n配置向导',  target: '扩展验证\n公司池' },
      { source: '扩展验证\n公司池',   target: '官方入口\n采样' },
      { source: '官方入口\n采样',     target: '原始信号\n归纳表' },

      /* 转折：第1行末尾 → 第2行进方向 */
      { source: '原始信号\n归纳表',   target: '提炼\n6个维度',
        lineStyle: { color: '#10b981', width: 2, curveness: -0.2 } },

      /* 第2行（从右到左） */
      { source: '提炼\n6个维度',      target: '构建\nB层+E层' },
      { source: '构建\nB层+E层',      target: 'MECE\n校验' },
      { source: 'MECE\n校验',          target: '生成\nHTML报告' },
      { source: '生成\nHTML报告',     target: '图表修正\n& 自检' },
      { source: '图表修正\n& 自检',   target: '视觉统一\n配色收敛' },

      /* 转折：第2行 → 最终节点 */
      { source: '视觉统一\n配色收敛',  target: '✓ 交付\nHTML报告',
        lineStyle: { color: '#ec4899', width: 2, curveness: -0.2 } },

      /* MECE 校验辅助连接 */
      { source: 'MECE\n校验',          target: '✓ 交付\nHTML报告',
        lineStyle: { color: '#8b5cf6', width: 1.5, type: 'dashed', curveness: 0.3 } },
    ];

    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        confine: true,
        backgroundColor: '#ffffff',
        borderColor: '#93c5fd',
        borderWidth: 1,
        textStyle: {
          color: '#0f172a',
          fontFamily: 'PingFang SC, Microsoft YaHei, system-ui, sans-serif',
          lineHeight: 20
        },
        formatter: params => {
          if (params.dataType === 'edge') return '';
          const d = params.data.d || '';
          const label = (params.data.rawLabel || params.data.name).replace(/\n/g, ' ');
          return `<div style="max-width:260px;font-size:12px">
            <div style="font-weight:700;margin-bottom:4px;font-size:13px">${label}</div>
            <div style="color:#475569;white-space:pre-line">${d}</div>
          </div>`;
        }
      },
      series: [{
        type: 'graph',
        layout: 'none',
        coordinateSystem: null,
        roam: false,
        edgeSymbol: ['none', 'arrow'],
        edgeSymbolSize: [0, 7],
        data: nodes.map(n => ({
          ...n,
          symbol: 'roundRect',
          symbolSize: [n.s, 52],
          itemStyle: {
            color: n.c,
            borderColor: 'rgba(255,255,255,0.7)',
            borderWidth: 2,
            shadowBlur: 10,
            shadowColor: 'rgba(15,23,42,0.10)'
          },
          label: {
            show: true,
            color: '#fff',
            fontSize: 11,
            fontWeight: '700',
            lineHeight: 15,
            formatter: n.name
          }
        })),
        links,
        lineStyle: {
          color: '#94a3b8',
          width: 1.8,
          curveness: 0.1,
          opacity: 0.8
        },
        emphasis: {
          focus: 'adjacency',
          lineStyle: { width: 3, color: '#3b82f6' }
        }
      }],
    });

    window.addEventListener('resize', () => chart.resize());

    /* ── 导出功能 ────────────────────────────────────────────── */
    document.getElementById('btn-svg').addEventListener('click', () => {
      const svgEl = document.querySelector('#chart > svg');
      if (!svgEl) { alert('SVG 尚未渲染，请稍候'); return; }
      const serializer = new XMLSerializer();
      let svgStr = serializer.serializeToString(svgEl);

      // 添加字体声明避免中文乱码（嵌入系统字体）
      const defsTag = svgStr.indexOf('<defs') !== -1 ? '' : '<defs><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC&amp;display=swap");</style></defs>';
      svgStr = svgStr.replace('<svg', defsTag + '<svg style="font-family: \'Noto Sans SC\', \'PingFang SC\', \'Microsoft YaHei\', sans-serif;"');

      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'agent-workflow.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-png').addEventListener('click', () => {
      const svgEl = document.querySelector('#chart > svg');
      if (!svgEl) { alert('SVG 尚未渲染，请稍候'); return; }
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svgEl);
      const svgWidth = svgEl.getAttribute('width') || 1200;
      const svgHeight = svgEl.getAttribute('height') || 480;
      const scale = 2; // 2x 分辨率

      const canvas = document.createElement('canvas');
      canvas.width = svgWidth * scale;
      canvas.height = svgHeight * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const img = new Image();
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      img.onload = () => {
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'agent-workflow.png';
          a.click();
        });
      };
      img.src = url;
    });
  </script>
</body>
</html>
